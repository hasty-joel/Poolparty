<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Emblem -->
    <radialGradient id="emblemGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#112948" />
      <stop offset="70%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#040810" />
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Tropical Water -->
    <linearGradient id="cyanGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem (Circular Luxury Crest) -->
  <g transform="translate(16, 12)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="136" height="136" rx="34" fill="url(#emblemGrad)" stroke="#1e293b" stroke-width="2" />
    <rect x="2" y="2" width="132" height="132" rx="32" fill="none" stroke="url(#cyanGradL)" stroke-width="1.5" opacity="0.4" />

    <!-- Radiant Ambient Core -->
    <circle cx="68" cy="68" r="48" fill="#06b6d4" opacity="0.12" filter="url(#logoGlow)" />

    <!-- Sun Crest -->
    <circle cx="68" cy="46" r="16" fill="url(#goldGradL)" filter="url(#logoGlow)" />
    <!-- Sun Rays -->
    <path d="M 68 18 L 68 24 M 48 26 L 53 31 M 88 26 L 83 31 M 40 46 L 46 46 M 90 46 L 96 46" 
          stroke="url(#goldGradL)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Water Ripples / Waves -->
    <path d="M 22 76 C 36 68, 52 82, 68 74 C 84 66, 100 80, 114 72 L 114 83 C 100 91, 84 77, 68 85 C 52 93, 36 79, 22 87 Z" 
          fill="url(#cyanGradL)" />

    <path d="M 22 93 C 36 86, 52 98, 68 91 C 84 84, 100 96, 114 89 L 114 99 C 100 106, 84 94, 68 101 C 52 108, 36 96, 22 103 Z" 
          fill="url(#cyanGradL)" opacity="0.75" />

    <!-- Floating Sparkle -->
    <circle cx="102" cy="38" r="2" fill="#fde047" opacity="0.8" />
  </g>

  <!-- Right Typography Zone -->
  <g transform="translate(176, 26)">
    <!-- Subtitle: Venue & Host Location -->
    <text x="0" y="22" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="3" 
          text-transform="uppercase" 
          fill="#94a3b8">
      PRINCE RESORT BUNAMWAYA
    </text>

    <!-- Main Title: POOL PARTY -->
    <text x="0" y="66" 
          font-family="'Outfit', system-ui, -apple-system, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="#ffffff">
      POOL <tspan fill="url(#goldGradL)">PARTY</tspan>
    </text>

    <!-- Tagline & Date Badge -->
    <g transform="translate(0, 84)">
      <!-- Mini Pill -->
      <rect x="0" y="0" width="138" height="22" rx="6" fill="#083344" stroke="#0e7490" stroke-width="1" />
      <text x="69" y="15" 
            font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
            font-size="10.5" 
            font-weight="700" 
            fill="#38bdf8" 
            text-anchor="middle">
        FRI 11 DEC 2026
      </text>

      <text x="154" y="15" 
            font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
            font-size="11" 
            font-weight="600" 
            fill="#64748b">
        BELLA · 12 PM TILL LATE
      </text>
    </g>
  </g>
</svg>
